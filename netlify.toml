[build]
  command     = "npm run build"
  publish     = "dist"
  functions   = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# ── CLOUDFLARE CACHE PURGE ────────────────────────────────────────────────────
# Runs after every successful deploy.
# Requires CF_ZONE_ID and CF_API_TOKEN env vars in Netlify dashboard.
[[plugins]]
  package = "./netlify/plugins/cloudflare-purge"

# Old site URLs — redirect to work page
[[redirects]]
  from   = "/work/zeroday.html"
  to     = "/work.html"
  status = 301

[[redirects]]
  from   = "/work/www.kevinhaus.com/*"
  to     = "/work.html"
  status = 301
